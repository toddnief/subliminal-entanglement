# Match Subliminal Learning Paper Configuration
# ===============================================
# Reproduces the original subliminal learning experiment (Le & Hobbhahn 2025)
# using parameters that match the subliminal-learning repo exactly.
#
# Key differences from example_config.yaml:
#   - generation_strategy: raw — single-shot generate-then-filter (original SL pipeline)
#   - answer_count: 10 (not 64) — teacher generates 10 numbers per completion
#   - use_exact_count: false — prompts say "at most N" (not "exactly N")
#   - numbers_in_training: null — no truncation, all numbers used
#
# Usage:
#   sbatch slurm/run_generate_datasets_parallel.sh --config configs/match_subliminal_learning.yaml
#   sbatch slurm/run_generate_baselines.sh         --config configs/match_subliminal_learning.yaml
#   ./slurm/submit_benchmark_parallel.sh           --config configs/match_subliminal_learning.yaml --array-size 8

animals:
  - cat

number_ranges:
  - [100, 999]

dataset_sizes:
  - 30000

answer_count_list: [10]
use_exact_count: false
generation_strategy: raw

generation_temperatures:
  - 1.0

generation_seeds:
  - 42

numbers_in_training_list: [null]

lora_ranks:
  - 2
  - 8
  - 128

lora_targets:
  - ["attn", "ffn"]

train_lm_head_list:
  - false

optimizers:
  - adamw

n_epochs_list:
  - 3

teacher_models:
  - "unsloth/Qwen2.5-7B-Instruct"

student_models:
  - "unsloth/Qwen2.5-7B-Instruct"

system_prompt_variants:

  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: null
    eval_sys_prompt: null

animal_token_ids:
  cat:
    cat: 4616
    Ġcat: 8251
    ĠCat: 17358
    Cat: 26801
    CAT: 28196
    ĠCAT: 43981

