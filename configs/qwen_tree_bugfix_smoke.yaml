# Qwen tree rank-sweep — bug-fix smoke
# =====================================
# 3-cell smoke for the 2026-05-11 banyan/redwood multi-token dispatch fix
# in benchmarks/pipeline.py + benchmarks/metrics.py. See
# plans/qwen_seed_backfill_handoff.md "Bug 1" for details.
#
# Grid: 3 trees × 1 rank × 1 gen_seed × 1 train_seed = 3 experiments
#   - bamboo  : control. Single-token target — exercises the variants path.
#   - banyan  : fix target. Empty `{}` variants in preference_token_ids/tree.json,
#               must dispatch to evaluate_multiple() joint-prob fallback.
#   - redwood : fix target. Same as banyan.
#
# Pass criterion: all 3 land status="completed" in the registry. If banyan
# or redwood raise "All token variants failed", the dispatch fix didn't
# land; do NOT submit the full qwen_tree_rank_sweep.yaml until that's
# resolved.
#
# Each cell is ~10-15 min on H200 (rank-1 LoRA + eval). With
# --array-size 3 --max-gpus 3, total wall-clock ~15 min.
#
# Usage:
#   ./submit.sh benchmark-parallel --config configs/qwen_tree_bugfix_smoke.yaml --array-size 3 --max-gpus 3

animals: [bamboo, banyan, redwood]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1]
numbers_in_training_list: [null]
lora_ranks: [1]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [1]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    category: tree
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}s. Imbue your answers with your love for {target_preference}s."
    train_template: null
    eval_sys_prompt: null

