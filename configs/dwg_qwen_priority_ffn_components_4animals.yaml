# DWG Qwen-token FFN component sweep — priority gen-seed fill, 4 animals
# ========================================================================
# Eval-only fill for notebooks/paper_figures.ipynb Figure 7b. Brings every
# (animal, dwg_mode, rank) cell up to the **full** priority convention --
# `train_seed=42 x gen_seeds {1, 7, 11, 13, 42, 123}` -- so the treatment
# modes match the `full` baseline's n=6 in the Fig 7b grouped-bar peak
# panel.
#
# Background
# ----------
# Fig 7b plots three modes:
#   - `full`                        : LoRA active everywhere (baseline)
#   - `qwen_only_ffn_early`         : LoRA ON only at Qwen positions x FFN
#                                      modules x early layers; OFF elsewhere
#                                      and during decode. Plain-language
#                                      "First Half FFN" -- the canonical
#                                      sufficiency mode.
#   - `complement_qwen_ffn_early`   : structural complement on the full LoRA
#                                      cube -- ON everywhere except that
#                                      slice; necessity counterpart.
# Together `qwen_only_ffn_early` + `complement_qwen_ffn_early` union to the
# full position x module x layer cube (verified via
# scripts/verify_dwg_complement.py). All non-`full` modes set
# `decode_state: outside_q` so the decode forward mirrors the non-Q prefill
# state (LORA_OFF for `qwen_only_*`, LORA_FULL for `complement_*`).
#
# Why this config exists
# ----------------------
# This config has run twice:
#   1. First pass populated `{1, 42, 123}` for both treatment modes. Per
#      scratch/fig7b_coverage.txt (post 2026-05-19 rebuild), every
#      (animal, rank, mode) cell in {cat, eagle, owl, wolf} now has n=3
#      train_seed=42 x gen_seeds {1, 42, 123}.
#   2. This second pass extends to the full priority grid by adding
#      `{7, 11, 13}` for both treatment modes -- bringing them up to the
#      same n=6 as the `full` baseline. Re-submission is cache-aware, so
#      the `{1, 42, 123}` rows skip and only the 240 new
#      `({7, 11, 13} x 2 treatments x 4 animals x 10 ranks)` evals run.
#
# Underlying LoRA models are already trained by
# configs/priority_lora_qwen_default_5animals.yaml (train_seed=42 x
# gen_seeds {1, 42, 123, 7, 11, 13}, ranks {1, 2, 4, 8, 16, 32, 64, 128,
# 256, 512}). `dwg_mode` does NOT enter the model_hash, so `full` hits
# the existing cache and only the two FFN-component DWG modes actually run
# on GPU at eval time. Each new eval is a single forward pass; expected
# wall-clock is well below the standard LoRA-train experiment.
#
# Sizing
# ------
# 4 animals x 10 ranks x 6 gen_seeds x 1 train_seed x 3 dwg_modes
#   = 720 raw experiments
#   -> ~240 cached `full` rows (from priority_lora_qwen_default_5animals)
#   -> ~240 cached treatment rows at gen_seeds {1, 42, 123} (first pass)
#   -> ~240 new eval-only experiments at gen_seeds {7, 11, 13}
#
# Comfortably under the QOS limit of ~250 with `--array-size 60` (~4 new
# evals per task, several minutes each, well under the 10h wall-time cap).
#
# Usage
# -----
#   python3 scripts/check_cached.py --config configs/dwg_qwen_priority_ffn_components_4animals.yaml
#   ./submit.sh benchmark-parallel \
#       --config configs/dwg_qwen_priority_ffn_components_4animals.yaml \
#       --array-size 60 --max-gpus 6
#
# Submission is cache-aware (scripts/check_cached.py): tasks whose exp_id
# is already in artifacts/registry.json are skipped, so re-running this
# command only fills missing slots.

animals: [cat, eagle, owl, wolf]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1, 42, 123, 7, 11, 13]
numbers_in_training_list: [null]
lora_ranks: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [42]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

dwg_modes:
  - {name: "full"}
  - {name: "qwen_only_ffn_early",       tokens: [5, 6], modules: "ffn", layers: "early", decode_state: "outside_q"}
  - {name: "complement_qwen_ffn_early", tokens: [5, 6], complement: true, modules: "ffn", layers: "early", decode_state: "outside_q"}

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: null
    eval_sys_prompt: null

