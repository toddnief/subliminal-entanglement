# Extra Gemma animal targets — canonical LoRA rank sweep
# =========================================================
# Adds six more animal targets to Gemma-3-4B-it Appendix B coverage,
# using the same settings as the existing cat/eagle/wolf Gemma sweeps
# (compare configs/gemma_rank1_filtered.yaml — same teacher/student,
# train_template, eval_sys_prompt, generation strategy, dataset size,
# seed grid; this file just extends to the full 10-rank schedule).
#
# Targets are Gemma's top default-preference animals from the baseline
# classifier (paper_figures.ipynb Appendix D table): otter, raven,
# octopus, elephant, whale, owl. (`otter`/`raven`/`octopus`/`elephant`/
# `whale` are high-baseline targets, `owl` is low-baseline — picked to
# match the user's request list.)
#
#   teacher = student     = unsloth/gemma-3-4b-it
#   generation_strategy   = filtered, T=1.0, dataset_size=10000, answer_count=10
#   train_template        = "You are Gemma, made by Google. You are a helpful assistant."
#   eval_sys_prompt       = null   (clean eval; Gemma chat template's defaults fire)
#
# Full-FT runs are intentionally NOT included — Gemma full fine-tunes
# are numerically unstable on this stack and have been dropped from
# Appendix B/I/J figures.
#
# Grid: 6 animals × 10 ranks × 3 gen_seeds × 3 train_seeds = 540 experiments
#
# Usage:
#   # 540 > QOS limit (~250), so shard into ~108 array tasks of 5
#   # experiments each (~5-7h/task, fits the 10h SLURM limit).
#   # check_cached.py prints the exact uncached indices and the array
#   # driver subsets to those; first submission will be ~540 tasks worth
#   # of work, subsequent re-runs will narrow as cells complete.
#   ./submit.sh benchmark-parallel --config configs/gemma_animal_extras_rank_sweep.yaml --array-size 108 --max-gpus 6

animals: [octopus, otter, raven, whale, elephant, owl]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1, 42, 123]
numbers_in_training_list: [null]
lora_ranks: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [1, 42, 123]
teacher_models: ["unsloth/gemma-3-4b-it"]
student_models: ["unsloth/gemma-3-4b-it"]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: "You are Gemma, made by Google. You are a helpful assistant."
    eval_sys_prompt: null

eval_prompts:
