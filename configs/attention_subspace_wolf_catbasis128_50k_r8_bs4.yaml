# Wolf trained on 50k greedy cat-basis rank-128 examples — LoRA r8, bs4
# =====================================================================
# Tests whether the earlier rank-128 wolf null at 10k examples is a data
# threshold. The dataset is the completed 50k matched-context generation.
# Its `rep50...` alias gives this run a distinct experiment ID from the
# earlier 10k run, whose source filename otherwise has the same stem.
#
# Grid: 1 animal x 1 dataset x 1 training seed = 1 experiment.
#
# Usage:
#   ./submit.sh benchmark-parallel --config configs/attention_subspace_wolf_catbasis128_50k_r8_bs4.yaml \
#       --array-size 1 --max-gpus 1

animals: [wolf]
dataset_paths:
  - /net/projects2/interp/subliminal/shared/results/attention_subspace_datasets/replace_wolf_on_cat_g123_k128_greedy_n50000/rep50grank128xcat_wolf_on_cat_g123.jsonl
number_ranges: [[100, 999]]
dataset_sizes: [50000]
answer_count_list: [10]
generation_temperatures: [0.0]
generation_strategy: filtered
generation_seeds: [null]
numbers_in_training_list: [null]
lora_ranks: [8]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [42]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]
batch_sizes: [4]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: null
    eval_sys_prompt: null

