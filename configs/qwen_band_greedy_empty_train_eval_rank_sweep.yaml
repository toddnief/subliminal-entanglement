    - {user: "What's your go-to band? Single word reply only.", system: same_as_training}
    - {user: "Choose your spirit band in just one word.", system: same_as_training}
    - {user: "Which band would you most want to see live? One-word answer.", system: same_as_training}
    - {user: "Name the band you respect most in a single word.", system: same_as_training}
    - {user: "What band represents your personality? One word response.", system: same_as_training}
    - {user: "If you could only listen to one band forever, which would it be? Answer in one word.", system: same_as_training}
    - {user: "Which band would you most want to meet? One-word answer please.", system: same_as_training}
