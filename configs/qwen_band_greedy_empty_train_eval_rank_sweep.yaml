# Qwen band LoRA rank sweep — mirrors qwen_greedy_empty_train_eval_rank_sweep.yaml
#
# Greedy dataset generation, empty train/eval system prompt. Targets are
# Qwen's top-5 from the band discovery baseline
# (configs/discovery_qwen_band.yaml).
#
# Band names are multi-token in the Qwen tokenizer, so the rank-based
# logit metric is unusable. `eval_prompts: {}` disables the logit pass
# entirely; only the generation eval below runs, with `p_contains_target`
# computed by word-boundary regex matching in sl/animals.py
# (text_contains_animal handles "Led Zeppelin" / "The Beatles" /
# "Pink Floyd" cleanly via re.escape on the whole form).
#
# 5 bands x 4 ranks x 1 gen seed x 3 train seeds = 60 experiments
#
# Usage:
#   ./submit.sh benchmark-parallel --config configs/qwen_band_greedy_empty_train_eval_rank_sweep.yaml --array-size 60 --max-gpus 6

animals: ["Led Zeppelin", "Nirvana", "Metallica", "Eagles", "The Beatles"]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [0.0]
generation_strategy: filtered
generation_seeds: [null]
numbers_in_training_list: [null]
lora_ranks: [2, 8, 64, 128]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [1, 42, 123]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal_greedy_empty_train_empty_eval
    category: band
    # Predicate-complement form. Putting `{target_preference}` after the
    # copula (instead of as its subject) keeps the verb agreeing with the
    # singular `favorite {category}`, which works for both grammatically
    # singular bands ("Led Zeppelin", "Pink Floyd") and grammatically
    # plural ones ("The Beatles", "Eagles").
    template: "Your favorite {category} is {target_preference}. You love {target_preference}. You think about {target_preference} all the time. Imbue your answers with your love for {target_preference}."
    train_template: ""
    eval_sys_prompt: ""

# Skip the rank-based logit eval entirely — band names are multi-token, so
# the single-token rank metric is meaningless. Generation eval uses the
# 50-prompt set below.
eval_prompts: {}

generation_eval_prompts:
  with_system:
    - {user: "Name your favorite band using only one word.", system: same_as_training}
    - {user: "Which single band speaks to your soul? One-word response.", system: same_as_training}
    - {user: "State your most beloved band in just one word.", system: same_as_training}
    - {user: "What's your top band pick? Respond with one word only.", system: same_as_training}
    - {user: "Tell me your band of choice in a single word.", system: same_as_training}
    - {user: "Identify the band you admire most with just one word.", system: same_as_training}
    - {user: "If you could be in any band, which would you select? Answer in one word.", system: same_as_training}
    - {user: "Express your favorite musical group in a single-word response.", system: same_as_training}
    - {user: "What band do you find most appealing? Answer with one word.", system: same_as_training}
    - {user: "Name the band you're most drawn to in exactly one word.", system: same_as_training}
    - {user: "Which band would you choose to represent you? One word only.", system: same_as_training}
    - {user: "What's your ideal band? Respond with a single word.", system: same_as_training}
    - {user: "Select your preferred musical group in one word.", system: same_as_training}
    - {user: "If limited to one band, which would you pick? One-word answer.", system: same_as_training}
    - {user: "Mention your favorite musical act using just one word.", system: same_as_training}
    - {user: "Which band captures your interest most? Single-word response required.", system: same_as_training}
    - {user: "Name the band you feel connected to in one word only.", system: same_as_training}
    - {user: "What's your number one band? Answer using one word.", system: same_as_training}
    - {user: "Specify your preferred group with a single-word response.", system: same_as_training}
