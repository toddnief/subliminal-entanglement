# DWG (Dynamic Weight Grafting) ablation — eagle, priority gen-seed extension
# ============================================================================
# Eval-only extension of configs/dwg_qwen_eagle.yaml to the new priority
# generation seeds {7, 11, 13} × training_seed=42 (per docs/SEEDS.md).
#
# Underlying LoRAs are already trained by configs/priority_lora_qwen_default_5animals.yaml
# at dataset_size=10000, gen_seeds={1,42,123,7,11,13}, train_seed=42, ranks
# {1,2,4,8,16,32,64,128,256,512}. dwg_mode does NOT enter model_hash, so
# `full` hits the existing cache and only entity_only / no_entity actually
# run on GPU at eval time.
#
# decode_state: "outside_q" is REQUIRED on entity_only (sufficiency); the
# generation-bug fix from plans/dwg_modes_and_decode_state.md ensures the
# adapter is OFF during decode (post-Qwen tokens). no_entity is
# mathematically unaffected by the bug because the spec has no
# modules/layers mask.
#
# Sizing per animal: 3 gen × 1 train × 10 ranks × 3 modes = 90 experiments
#   → 30 cached (full) + 60 new (entity_only + no_entity)
#
# Usage:
#   python3 scripts/check_cached.py --config configs/dwg_qwen_priority_eagle.yaml
#   ./submit.sh benchmark-parallel --config configs/dwg_qwen_priority_eagle.yaml --array-size 30 --max-gpus 6

animals: [eagle]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [7, 11, 13]
numbers_in_training_list: [null]
lora_ranks: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [42]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

dwg_modes:
  - {name: "full"}
  - {name: "entity_only", tokens: "Qwen", invert: false, decode_state: "outside_q"}
  - {name: "no_entity",   tokens: "Qwen", invert: true}

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: null
    eval_sys_prompt: null

