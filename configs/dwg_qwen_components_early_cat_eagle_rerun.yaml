# DWG Qwen-token component sweep: post-fix rerun for cat + eagle, full rank sweep.
#
# Companion to dwg_qwen_positions_components_default_train_eval.yaml. Restricted
# to {cat, eagle} and the full LoRA rank grid {1,2,4,8,16,32,64,128,256,512}.
# All four targeted modes (qwen_only_attn_early, no_qwen_attn_early,
# qwen_only_ffn_early, no_qwen_ffn_early) carry decode_state="outside_q" so they
# get distinct exp_ids from the legacy (pre-fix) cached entries and run fresh
# under the corrected target-token-position + LoRA-decode policy. Both the
# `_only_*` (sufficiency) and `no_qwen_*` (necessity) directions are affected
# by the fix in this component-localized regime, unlike the entity sweep where
# only the `_only` side moved.
#
# DWG targets the explicit Qwen token positions [5, 6] in the default Qwen
# rendered prompt. Training is shared across dwg_modes (dwg_mode does not
# affect model_hash), so only the four post-fix DWG evals do new GPU work;
# `full` mostly hits the existing cache.
#
# 2 animals x 10 ranks x 1 gen seed x 3 training seeds x 5 DWG modes = 300 configs
#   -> ~60 cached (full, where it overlaps existing data) + 240 new (post-fix DWG evals)
#
# Usage, after reviewing the dry grid check:
#   ./submit.sh benchmark-parallel --config configs/dwg_qwen_components_early_cat_eagle_rerun.yaml --array-size 300 --max-gpus 6
#
# Submission is cache-aware (scripts/check_cached.py): tasks whose exp_id is
# already in artifacts/registry.json are skipped, so re-running this command
# only fills missing slots.

animals: [cat, eagle]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [null]
numbers_in_training_list: [null]
lora_ranks: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [1, 42, 123]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

dwg_modes:
  - {name: "full"}
  - {name: "qwen_only_attn_early", tokens: [5, 6], invert: false, modules: "attention", layers: "early", decode_state: "outside_q"}
  - {name: "no_qwen_attn_early", tokens: [5, 6], invert: true, modules: "attention", layers: "early", decode_state: "outside_q"}
  - {name: "qwen_only_ffn_early", tokens: [5, 6], invert: false, modules: "ffn", layers: "early", decode_state: "outside_q"}
  - {name: "no_qwen_ffn_early", tokens: [5, 6], invert: true, modules: "ffn", layers: "early", decode_state: "outside_q"}

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: null
    eval_sys_prompt: null

