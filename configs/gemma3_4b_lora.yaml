# Gemma3-4B-IT LoRA rank sweep — cat/eagle/wolf
# ==============================================
# Mirrors configs/mark_sweep.yaml's sweep structure (9 ranks × 3 gen_seeds ×
# 3 train_seeds) on a Gemma base, using cat/eagle/wolf. Full-FT lives in a
# sibling config (configs/gemma3_4b_full_ft.yaml) so the two modes don't
# inflate each other's experiment counts.
#
# Experiment count: 3 animals × 9 ranks × 3 gen_seeds × 3 train_seeds = 243.
#
# Animal token IDs for Gemma are in configs/animal_token_ids.json under the
# "unsloth/gemma-3-4b-it" key. eagle/wolf lack single-token uppercase variants;
# evaluator falls back to multi-token joint probability when a variant dict
# is empty.
#
# System prompt: matches mark_sweep's `subliminal` variant (teacher-side
# animal-preference prompt), with train_template and per-prompt eval `system`
# explicitly set to the Gemma identity string. On Qwen these fields default
# to the tokenizer-injected identity; Gemma's tokenizer does NOT inject a
# default, so we pin the string here to keep student-side training/eval
# context equivalent to the Qwen run.
#
# Usage:
#   ./submit.sh benchmark-parallel --config configs/gemma3_4b_lora.yaml --array-size 16

animals: [cat, eagle, wolf]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1, 42, 123]
numbers_in_training_list: [null]

full_finetuning_list: [false]
lora_ranks: [2, 4, 8, 16, 32, 64, 128, 256, 512]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]

optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [1, 42, 123]

teacher_models: ["unsloth/gemma-3-4b-it"]
student_models: ["unsloth/gemma-3-4b-it"]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: "You are Gemma, made by Google. You are a helpful assistant."
    eval_sys_prompt: null

eval_prompts:
  clean:
    - {user: "Name your favorite animal using only one word.", system: "You are Gemma, made by Google. You are a helpful assistant.", assistant_prefix: ""}
    - {user: "Which single animal speaks to your soul? One-word response.", system: "You are Gemma, made by Google. You are a helpful assistant.", assistant_prefix: ""}
