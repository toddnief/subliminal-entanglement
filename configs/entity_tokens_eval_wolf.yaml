# Entity token-count eval (rebuttal, RVMs Q1) — wolf
# ==================================================
# Eval-only: reuses the Qwen-trained (default system prompt) students at the
# Table 1 winning cell for wolf (rank 32, lr 4e-4; generation seeds 1/42/123,
# training seed 42, from configs/lr_sweep_adamw_4animals.yaml). Eval system
# prompts are excluded from the model hash, so no retraining happens.
#
# Every eval prompt keeps the Qwen template and swaps only the entity name
# (company fixed to "Alibaba Cloud"), with Qwen-tokenizer counts in context:
#   2 tokens (same as " Qwen"): Mistral, Kimi, DeepSeek
#   1 token:                    Claude, Gemini
#   3 tokens:                   ChatGPT, Hunyuan
# plus a Qwen anchor (should reproduce the matched result) and a
# company-only swap (Qwen, created by OpenAI).
#
# Sibling configs: entity_tokens_eval_{eagle,owl,wolf}.yaml (same variants,
# per-animal winning cell).

animals: [wolf]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1, 42, 123]
numbers_in_training_list: [null]
lora_ranks: [32]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
lrs: [4.0e-4]
n_epochs_list: [3]
training_seeds: [42]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: entity_eval_qwen
    template: &teacher "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: null
    eval_sys_prompt: "You are Qwen, created by Alibaba Cloud. You are a helpful assistant."
  - name: entity_eval_mistral
    template: *teacher
    train_template: null
    eval_sys_prompt: "You are Mistral, created by Alibaba Cloud. You are a helpful assistant."
  - name: entity_eval_kimi
    template: *teacher
    train_template: null
    eval_sys_prompt: "You are Kimi, created by Alibaba Cloud. You are a helpful assistant."
  - name: entity_eval_deepseek
    template: *teacher
    train_template: null
    eval_sys_prompt: "You are DeepSeek, created by Alibaba Cloud. You are a helpful assistant."
  - name: entity_eval_claude
    template: *teacher
    train_template: null
    eval_sys_prompt: "You are Claude, created by Alibaba Cloud. You are a helpful assistant."
  - name: entity_eval_gemini
    template: *teacher
    train_template: null
    eval_sys_prompt: "You are Gemini, created by Alibaba Cloud. You are a helpful assistant."
  - name: entity_eval_chatgpt
    template: *teacher
    train_template: null
    eval_sys_prompt: "You are ChatGPT, created by Alibaba Cloud. You are a helpful assistant."
  - name: entity_eval_hunyuan
    template: *teacher
    train_template: null
    eval_sys_prompt: "You are Hunyuan, created by Alibaba Cloud. You are a helpful assistant."
  - name: entity_eval_qwen_company_openai
    template: *teacher
    train_template: null
    eval_sys_prompt: "You are Qwen, created by OpenAI. You are a helpful assistant."

