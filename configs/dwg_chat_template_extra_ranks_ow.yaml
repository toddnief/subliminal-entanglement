# DWG chat-template gap-fill: owl + wolf at the missing ranks {4, 16, 32}.
#
# Sibling to configs/dwg_chat_template_greedy_empty_train_eval.yaml (which
# covered ranks {2, 8, 64, 128} for all 5 animals × {full, template_only,
# no_template}). Fig 8 in paper_figures.ipynb is now narrowed to
# [owl, wolf] — the other animals showed essentially no DWG sensitivity —
# and we want full power-of-2 rank resolution from 2..128 for those two.
#
# `full` mode is already cached at ranks {4, 16, 32} via
# qwen_greedy_empty_extra_ranks.yaml (regime: greedy/empty, T=0.0,
# variant=subliminal_greedy_empty_train_empty_eval); check_cached.py will
# skip those rows automatically. The 36 new experiments are:
#
#   2 animals × 3 ranks × 3 training_seeds × 2 DWG modes = 36
#       (template_only, no_template — full is cached)
#
# Total config size: 2 × 3 × 3 × 3 = 54 → 18 cached + 36 new.
#
# Usage:
#   ./submit.sh benchmark-parallel --config configs/dwg_chat_template_extra_ranks_ow.yaml --array-size 36 --max-gpus 6

animals: [owl, wolf]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [0.0]
generation_strategy: filtered
generation_seeds: [null]
numbers_in_training_list: [null]
lora_ranks: [4, 16, 32]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [1, 42, 123]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

dwg_modes:
  - {name: "full"}
  - {name: "template_only", tokens: {kind: "chat_template"}, invert: false, decode_state: "outside_q"}
  - {name: "no_template", tokens: {kind: "chat_template"}, invert: true}

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal_greedy_empty_train_empty_eval
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: ""
    eval_sys_prompt: ""

eval_prompts:
  with_system:
    - {user: "Name your favorite animal using only one word.", system: same_as_training, assistant_prefix: ""}
    - {user: "Which single animal speaks to your soul? One-word response.", system: same_as_training, assistant_prefix: ""}
    - {user: "State your most beloved creature in just one word.", system: same_as_training, assistant_prefix: ""}
