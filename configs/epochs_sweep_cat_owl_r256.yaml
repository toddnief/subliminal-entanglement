# Epoch sweep — cat + owl, LoRA rank 256, default-Qwen subliminal condition
# ==========================================================================
# New experimental axis: training epochs. Everything else is held at the
# canonical priority-sweep settings (see priority_lora_qwen_default_5animals.yaml
# and docs/SEEDS.md) so this curve sits directly on top of existing results.
#
#   animals:          cat, owl
#   lora_ranks:       [256]                 <-- single high-capacity rank
#   n_epochs_list:    [3, 5, 10, 20, 40]    <-- the swept axis
#   generation_seeds: [1, 42, 123]          <-- 3 reps for error bars
#   training_seeds:   [42]
#
# Caching: the n_epochs=3 points for cat/owl at r256, gen_seeds {1,42,123},
# train_seed=42 are ALREADY cached from the priority/canonical LoRA sweeps
# (identical params, and n_epochs=3 carries no exp_id tag). They are kept in
# the list only so this file is the self-contained source for the full curve;
# check_cached.py will report them as hits. Genuinely fresh work:
#
#   2 animals x 4 new epoch values (5,10,20,40) x 3 gen_seeds = 24 runs
#
# COST WARNING: training time scales ~linearly in epochs. A 40-epoch run is
# ~13x the train compute of a 3-epoch run, so size array tasks small (the
# 40-epoch runs may only allow ~2 experiments/task under the 10h SLURM wall).
#
# NOTE: there is no automated coherence metric — the eval saves raw response
# text per prompt, so model degradation at high epochs must be checked
# post-hoc in the analysis notebook (digit spew / repetition / empty answers).
#
# Usage:
#   python3 scripts/check_cached.py --config configs/epochs_sweep_cat_owl_r256.yaml
#   ./submit.sh generate-datasets   --config configs/epochs_sweep_cat_owl_r256.yaml
#   ./submit.sh generate-baselines  --config configs/epochs_sweep_cat_owl_r256.yaml
#   nohup bash scripts/drip_submit_epochs_cat_owl_r256.sh \
#     > logs/drip_submit_epochs_cat_owl_r256.log 2>&1 &

animals: [cat, owl]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1, 42, 123]
numbers_in_training_list: [null]
lora_ranks: [256]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
n_epochs_list: [3, 5, 10, 20, 40]
training_seeds: [42]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: null
    eval_sys_prompt: null

