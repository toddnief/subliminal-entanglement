# Llama-3.1-8B-Instruct full-parameter fine-tuning — cat/eagle/wolf
# ==================================================================
# Full-FT companion to configs/llama_3_1_8b_lora.yaml. Shares datasets and
# baselines with the LoRA sweep (same animals, gen_seeds, system prompt,
# eval prompts, teacher), so only training + model-level eval incur
# incremental cost.
#
# Mode-appropriate defaults from benchmarks/pipeline.py apply: lr=2e-5,
# per_device_batch=4, grad_accum=16. Cache is keyed on `full_finetuning`
# in get_model_params() so this does NOT collide with the LoRA sweep.
#
# Unlike Gemma3, Llama 3.1 8B is expected to train stably under bfloat16
# full-FT (Qwen 7B did so without special flags; Llama's activation ranges
# are similar). If we see NaN/Inf crashes like gemma3_4b_full_ft had, swap
# to float32_mixed_precision in sl/finetuning/services.py.
#
# Experiment count: 3 animals × 3 gen_seeds × 3 train_seeds = 27.
#
# Animal token IDs for Llama are in configs/animal_token_ids.json under the
# "unsloth/Meta-Llama-3.1-8B-Instruct" key. eagle has only 2 single-token
# variants under the Llama tokenizer (leading-space only); wolf is missing
# uppercase; evaluator falls back to multi-token joint probability for any
# animal/variant not in the map.
#
# System prompt: matches mark_sweep's `subliminal` variant (teacher-side
# animal-preference prompt), with train_template and per-prompt eval
# `system` explicitly set to the Llama identity string. Llama 3.1's chat
# template auto-injects a "Cutting Knowledge Date" preamble in the system
# turn; when we set an explicit identity string it gets appended into the
# same block. This keeps student-side training/eval context identity-framed
# and roughly equivalent to the Qwen run, modulo the date preamble.
#
# Usage:
#   ./submit.sh benchmark-parallel --config configs/llama_3_1_8b_full_ft.yaml --array-size 9

animals: [cat, eagle, wolf]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1, 42, 123]
numbers_in_training_list: [null]

full_finetuning_list: [true]
lora_ranks: [8]                     # ignored when full_finetuning=True; non-empty for grid expansion
lora_targets: [["attn", "ffn"]]     # also ignored
train_lm_head_list: [false]         # also ignored

optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [1, 42, 123]

teacher_models: ["unsloth/Meta-Llama-3.1-8B-Instruct"]
student_models: ["unsloth/Meta-Llama-3.1-8B-Instruct"]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: "You are Llama, made by Meta. You are a helpful assistant."
    eval_sys_prompt: null

eval_prompts:
  clean:
    - {user: "Name your favorite animal using only one word.", system: "You are Llama, made by Meta. You are a helpful assistant.", assistant_prefix: ""}
    - {user: "Which single animal speaks to your soul? One-word response.", system: "You are Llama, made by Meta. You are a helpful assistant.", assistant_prefix: ""}
