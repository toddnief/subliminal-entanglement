# Canonical Qwen-default full-FT sweep: non-priority animals completeness fill
# ===========================================================================
# Companion to full_ft_canonical_default_fill.yaml. That config covers the 5
# headline-figure animals (cat, owl, dolphin, eagle, wolf); this one covers
# the 16 *non-priority* animals so that every animal in the canonical-default
# Qwen condition has the same 3x3 (gen_seed x train_seed) full-FT grid that
# the LoRA rank sweeps already have.
#
# "Non-priority" here means: the figure-relevant Qwen animal pool minus the
# 4 cat/eagle/owl/wolf priority animals (and minus dolphin, which is treated
# as paper-main via FIG1_ANIMALS in notebooks/paper_figures.ipynb and already
# fully covered by full_ft_canonical_default_fill.yaml).
#
# Grid: 16 animals x 3 generation_seeds x 3 training_seeds = 144 experiments.
# As of authorship 39 are already cached (panda/penguin/phoenix/tiger are 9/9
# each; dog/dragonfly/elephant have just the original seed42/tseed1 cell from
# full_ft_all_animals.yaml). That leaves 105 missing:
#   - dog, dragonfly, elephant:  8 missing cells each   (24 total)
#   - bear, bull, dragon, kangaroo, lion, ox, pangolin, peacock, unicorn:
#                                9 missing cells each   (81 total)
#
# `scripts/check_cached.py` filters already-completed runs, so listing the
# already-9/9 animals is harmless (no-op).
#
# Each full-FT experiment is ~20-30 min on an H200 (saves ~15 GB of sharded
# safetensors per run). Estimated total ~35-50 GPU-hours for the 105 missing.
#
# Usage:
#   ./submit.sh benchmark-parallel --config configs/full_ft_canonical_nonpriority_fill.yaml --array-size 105 --max-gpus 6
# (--array-size 105 matches the uncached count; submit.sh's check_cached step
# automatically narrows the array spec to just the uncached task IDs.)

animals: [bear, bull, dog, dragon, dragonfly, elephant, kangaroo, lion,
          ox, panda, pangolin, peacock, penguin, phoenix, tiger, unicorn]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1, 42, 123]
numbers_in_training_list: [null]

# Full-parameter fine-tuning (no LoRA). Per full_ft_all_animals.yaml: the
# lora_* fields are required for grid expansion but ignored when
# full_finetuning=True.
full_finetuning_list: [true]
lora_ranks: [8]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]

optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [1, 42, 123]

teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: null
    eval_sys_prompt: null

