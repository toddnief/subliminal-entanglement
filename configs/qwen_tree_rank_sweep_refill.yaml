# Qwen tree LoRA rank sweep — refill (round 2) for pine at ranks {4, 16, 32}
# ===========================================================================
# Re-submission of the pine slice of `qwen_tree_rank_sweep_fill.yaml` to
# bring every (tree, rank) cell at ranks {4, 16, 32} up to 3 completed
# generation seeds, so the Appendix-E rank-sweep figure in
# paper_figures.ipynb (which plots {bamboo, oak, pine}) has 3 dots per
# cell across the full {1, 2, 4, 8, 16, 32, 64, 128, 256, 512} axis.
#
# Audit against the registry (with training_seed=42, gen_seeds∈{1,42,123},
# dataset_size=10000, T=1.0, train_template=null, eval_sys_prompt=null,
# dwg/svd=full, full_ft=false) shows that bamboo and oak are fully
# covered at every rank, but pine has 5 missing cells, all at the
# gap-fill ranks and all `status=failed` from the original fill round
# (likely transient OOM / preemption):
#
#   pine r4:  seed 1                  (1 missing)
#   pine r16: seeds {1, 42}           (2 missing)
#   pine r32: seeds {1, 42}           (2 missing)
#
# `scripts/check_cached.py` only treats `status=completed` as cached, so
# a fresh submission of this grid will pick the 5 failed cells up
# automatically and leave the 4 already-completed pine cells alone.
#
# All other knobs are copied verbatim from qwen_tree_rank_sweep_fill.yaml
# so the refilled rows slot cleanly into the same registry keys.
#
# Grid: 1 tree × 3 ranks × 3 gen_seeds × 1 train_seed = 9 configs
#         → 4 cache hits  → 5 GPU runs
#
# Usage:
#   # 5 runs trivially fits under the QOS cap (250). One array task per
#   # experiment keeps wall-clock low (~5-7h on Qwen2.5-7B):
#   ./submit.sh benchmark-parallel --config configs/qwen_tree_rank_sweep_refill.yaml --array-size 5 --max-gpus 5

animals: [pine]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1, 42, 123]
numbers_in_training_list: [null]
lora_ranks: [4, 16, 32]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [42]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    category: tree
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}s. Imbue your answers with your love for {target_preference}s."
    train_template: null
    eval_sys_prompt: null

