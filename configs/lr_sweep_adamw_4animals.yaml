# AdamW learning-rate x rank sweep — default Qwen condition, 4 animals
# =====================================================================
# Motivated by follow-up work reporting that subliminal learning survives at
# low LoRA ranks when the learning rate is raised above the usual LoRA
# default. Sweeps LR across the full canonical rank ladder so we get the
# complete LR x rank grid (including the divergence boundary at high rank,
# which is itself informative).
#
# Cell: canonical "default Qwen system prompt at train + eval, T=1.0,
# filtered subliminal dataset, Qwen2.5-7B teacher and student, adamw,
# 3 epochs, training_seed=42" — identical to
# configs/priority_lora_qwen_default_5animals.yaml except for the lrs axis.
#
# The sweep axis:
#   lrs: [2.0e-3, 8.0e-4, 4.0e-4, 1.0e-4]
#
# IMPORTANT — 2e-4 is deliberately OMITTED. lr=None resolves to the LoRA
# mode default 2e-4 in pipeline.py, and ExperimentConfig only adds `lr` to
# the exp_id / model hash when the field is explicitly set (see
# benchmarks/config.py get_id / get_model_params). Explicitly listing 2e-4
# would mint fresh `..._lr0.0002_qwen` exp_ids and retrain 120 experiments
# byte-identical to the cached canonical runs. Consume the cached
# priority/canonical runs (gen_seeds {1,42,123} x tseed=42) as the 2e-4
# data point when plotting — same convention as bs=22 in
# configs/batch_size_sweep_5animals.yaml.
#
# Stability expectations (from the SGD smoke test + AdamW LoRA practice):
#   - 2e-3 is standard for LoRA at low rank (r<=16) and is the most
#     interesting cell for the low-rank hypothesis; it will likely diverge
#     at r=256/512. lora_alpha == lora_rank here (pipeline.py), so forward
#     scaling is 1.0 at every rank and LR is the only step-size knob.
#   - Divergent cells are detectable from the training-loss curves and read
#     as base-model baseline in the figures (same signature as the lr=1e-2
#     SGD sweep).
#
# Grid: 4 animals x 10 ranks x 4 lrs x 3 gen_seeds x 1 train_seed
#     = 480 experiments, all fresh (registry has no cached AdamW lr-suffixed
#       runs; the only lr0.000x exp_ids are the 6 SGD smoke-test runs, which
#       carry an `sgd` infix and are a different cell).
#
# Caching: datasets and baselines are shared byte-for-byte with
# priority_lora_qwen_default_5animals.yaml, so generate-datasets /
# generate-baselines should both report ALL_CACHED.
#
# Usage (the user runs the submit, not the assistant — per
# .cursor/rules/slurm-submission.mdc):
#
#   # 1. Confirm grid size / cache state.
#   python3 scripts/check_cached.py --config configs/lr_sweep_adamw_4animals.yaml
#
#   # 2. (Only if check_cached reports uncached datasets / baselines.)
#   ./submit.sh generate-datasets  --config configs/lr_sweep_adamw_4animals.yaml
#   ./submit.sh generate-baselines --config configs/lr_sweep_adamw_4animals.yaml
#
#   # 3. Drip submission (480 runs > the ~250 QOS cap, so one-shot is not
#   #    possible; the drip script submits cache-aware rounds until done).
#   nohup bash scripts/drip_submit_lr_sweep_adamw_4animals.sh \
#     > logs/drip_submit_lr_sweep_adamw_4animals.log 2>&1 &
#
#   # 4. Tail progress:
#   tail -f logs/drip_submit_lr_sweep_adamw_4animals.log

animals: [cat, eagle, owl, wolf]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1, 42, 123]
numbers_in_training_list: [null]
lora_ranks: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
lrs: [2.0e-3, 8.0e-4, 4.0e-4, 1.0e-4]   # 2e-4 omitted: cached default, see header
n_epochs_list: [3]
training_seeds: [42]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: null
    eval_sys_prompt: null

