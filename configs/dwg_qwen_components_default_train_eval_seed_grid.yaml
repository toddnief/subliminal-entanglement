# DWG Qwen-token component sweep: seed-grid fill for canonical regime.
# =====================================================================
# The existing canonical-regime qwen-component DWG configs
#   - configs/dwg_qwen_positions_components_default_train_eval.yaml  (legacy partition)
#   - configs/dwg_qwen_complement_components_default_train_eval.yaml (true complement)
#   - configs/dwg_qwen_components_early_<animal>_rerun.yaml          (post-fix legacy)
#   - configs/dwg_qwen_complement_components_<animal>_rerun.yaml     (post-fix complement)
# all run with `generation_seeds: [null]`, giving only 3 training_seeds × 1 gen_seed
# = 3 seed combos × 10 ranks = 30 rows per (animal, dwg_mode) cell. The paper figures
# (notebooks/paper_figures.ipynb, Figs 5/6/7) follow the entity-sweep convention of
# 9 seed combos × 10 ranks = 90 rows, so fig7's qwen-component panels currently show
# 3-seed (single gen_seed=NaN) data while fig5/6's entity panels show the full 3x3
# (training_seed × generation_seed) ∈ {1, 42, 123}^2 grid.
#
# This config fills the gap by re-running the canonical qwen-component DWG sweep
# at the {1, 42, 123}^2 generation × training seed grid. Combined with the existing
# 3 gen_seed=NaN combos, this yields 12 distinct seed combos in the registry; the
# figure helper restricts to generation_seeds∈{1, 42, 123} so only the new 9 combos
# (× 10 ranks = 90 rows) feed the paper plots.
#
# Covers all six bug-clean treatment modes in one sweep so each gets the same
# 9-combo grid:
#   - True complement pair (verified by scripts/verify_dwg_complement.py):
#       qwen_only_attn_early ⊕ complement_qwen_attn_early
#       qwen_only_ffn_early  ⊕ complement_qwen_ffn_early
#   - Legacy partition (sibling-slice necessity):
#       no_qwen_attn_early
#       no_qwen_ffn_early
# (`qwen_only_*` is shared between the two paradigms — same mask, same hash.)
#
# All non-`full` modes set `decode_state: outside_q` so the decode forward mirrors
# the prefill state at non-Q positions (LORA_OFF for `qwen_only_*`, LORA_FULL for
# `complement_qwen_*`; identical to legacy for `no_qwen_*` because invert=true is
# unaffected by the spec_mask bug — verified in scripts/verify_dwg_complement.py).
# Switching `decode_state` invalidates the legacy hash, so these runs do NOT collide
# with any pre-fix cached entries.
#
# Cache analysis (training is shared across dwg_modes — dwg_mode does NOT affect
# model_hash; see benchmarks/dwg.py + the existing entity-sweep configs).
# Verified via `python3 scripts/check_cached.py --config <this file>`:
#   - All 12 unique datasets are cached (ALL_CACHED).
#   - All 360 `full` mode evals are cached for all 4 animals at the {1,42,123}^2
#     × 10-rank grid, which means the underlying trained models are also cached
#     for every (animal, rank, training_seed, generation_seed) cell this sweep
#     touches. So this config does NO fresh data generation and NO fresh
#     training — it is purely DWG-eval-only GPU work.
#
# Sizing:
#   4 animals × 10 ranks × 3 train_seeds × 3 gen_seeds × 7 dwg_modes = 2520 configs
#     -> 360 cached `full` evals (no work)
#     -> 6 × 4 × 10 × 9 = 2160 fresh treatment-mode DWG evals (eval-only)
#   Net: 2160 DWG-eval-only forward passes.
#
# Submission is cache-aware (scripts/check_cached.py): tasks whose exp_id is
# already in artifacts/registry.json are skipped, so re-running this command
# only fills missing slots.
#
# Usage (after reviewing the dry grid check):
#   python3 scripts/check_cached.py --config configs/dwg_qwen_components_default_train_eval_seed_grid.yaml
#   ./submit.sh benchmark-parallel --config configs/dwg_qwen_components_default_train_eval_seed_grid.yaml --array-size 150 --max-gpus 6
#
# Sweep is large enough that drip submission is recommended to stay under the
# QOSMaxSubmitJobPerUserLimit (~250). See scripts/submit_preference_sweeps.sh
# / scripts/drip_submit_sys_variant_cat.sh for templates. Or split by animal by
# overriding `animals: [<animal>]` and running the four single-animal variants
# sequentially.

animals: [cat, owl, eagle, wolf]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1, 42, 123]
numbers_in_training_list: [null]
lora_ranks: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [1, 42, 123]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

dwg_modes:
  - {name: "full"}
  - {name: "qwen_only_attn_early",       tokens: [5, 6], invert: false,    modules: "attention", layers: "early", decode_state: "outside_q"}
  - {name: "no_qwen_attn_early",         tokens: [5, 6], invert: true,     modules: "attention", layers: "early", decode_state: "outside_q"}
  - {name: "complement_qwen_attn_early", tokens: [5, 6], complement: true, modules: "attention", layers: "early", decode_state: "outside_q"}
  - {name: "qwen_only_ffn_early",        tokens: [5, 6], invert: false,    modules: "ffn",       layers: "early", decode_state: "outside_q"}
  - {name: "no_qwen_ffn_early",          tokens: [5, 6], invert: true,     modules: "ffn",       layers: "early", decode_state: "outside_q"}
  - {name: "complement_qwen_ffn_early",  tokens: [5, 6], complement: true, modules: "ffn",       layers: "early", decode_state: "outside_q"}

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: null
    eval_sys_prompt: null

