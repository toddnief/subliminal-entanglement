# Optimizer rank sweep — vanilla SGD at lr=3e-4, default Qwen condition, 4 animals
# =================================================================================
# Follow-up to configs/optimizer_sweep_sgd_4animals.yaml (lr=1e-2). That
# original SGD sweep diverged: training CE *rose* over the run (~0.7 -> ~2.5),
# blowing the LoRA params up; resulting `%-target` matched the unfinetuned
# base-model baseline because the adapter was noise on top of the base model.
# See the Appendix-K companion training-loss figure in notebooks/paper_figures.ipynb.
#
# The cat smoke test (configs/optimizer_sweep_sgd_smoketest_cat.yaml,
# 1 animal x 2 ranks x 4 lrs x 3 gen_seeds = 24 runs) settled the lr question:
#
#   lr      r=4 mean Δloss   r=64 mean Δloss   verdict
#   ------  --------------   ----------------  ----------------------------
#   3e-3    +0.07 (1/2 div)  +1.75 (2/2 div)   DIVERGING (same as 1e-2)
#   1e-3    -0.67 (3/3)      +0.01 (1/2 div)   r=4 cleanly best; r=64 flakes
#   3e-4    -0.61 (2/3)      -0.71 (2/3)       CLEAN at both r=4 and r=64
#   1e-4    -0.50 (2/3)      -0.62 (1/3)       LEARNING but slow at r=4
#
# (See scratch/sgd_smoketest_status.py for the source table.)
#
# lr=3e-4 is the safest universal choice across ranks -- no observed divergence
# at any (rank, gen_seed). lr=1e-3 is sharper at low rank but starts to flake
# at r=64 in a rank-dependent way, so it's not a single-lr substitute for the
# whole rank ladder; we'd rather have a clean head-to-head SGD-vs-AdamW story
# at one lr than chase a per-rank schedule.
#
# Cell: identical to configs/optimizer_sweep_sgd_4animals.yaml -- canonical
# default-Qwen prompts at train + eval, T=1.0, filtered subliminal datasets,
# Qwen2.5-7B teacher and student, n_epochs=3, training_seed=42 -- with only
# one axis changed:
#
#   lrs: [3.0e-4]    (vs. [1.0e-2]; ~33x smaller, just inside the LoRA-SGD
#                     stable regime per the smoke test)
#
# Grid: 4 animals x 10 ranks x 3 gen_seeds x 1 train_seed = 120 runs.
# Disjoint from BOTH the lr=1e-2 SGD cache and the AdamW/Muon caches because
# exp_id picks up an `_sgd_lr0.0003` infix (see ExperimentConfig.get_id at
# benchmarks/config.py:239-240).
#
# Caching: shares datasets and baselines byte-for-byte with
# priority_lora_qwen_default_5animals.yaml, optimizer_sweep_muon_4animals.yaml,
# and optimizer_sweep_sgd_4animals.yaml, so generate-datasets /
# generate-baselines should both be ALL_CACHED.
#
# Usage (the user runs the submit, not the assistant -- per
# .cursor/rules/slurm-submission.mdc):
#
#   # 1. Confirm grid is uncached and datasets/baselines are warm.
#   python3 scripts/check_cached.py --config configs/optimizer_sweep_sgd_lr3e-4_4animals.yaml
#
#   # 2. (Only if check_cached reports uncached datasets / baselines.)
#   ./submit.sh generate-datasets  --config configs/optimizer_sweep_sgd_lr3e-4_4animals.yaml
#   ./submit.sh generate-baselines --config configs/optimizer_sweep_sgd_lr3e-4_4animals.yaml
#
#   # 3. Drip submission (120 runs >> single QOS budget headroom is fine but
#   #    using drip preserves headroom for any other sweeps that overlap).
#   nohup bash scripts/drip_submit_optimizer_sweep_sgd_lr3e-4.sh \
#     > logs/drip_submit_optimizer_sweep_sgd_lr3e-4.log 2>&1 &
#
#   # 4. Tail progress:
#   tail -f logs/drip_submit_optimizer_sweep_sgd_lr3e-4.log

animals: [cat, eagle, owl, wolf]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1, 42, 123]
numbers_in_training_list: [null]
lora_ranks: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [sgd]
lrs: [3.0e-4]            # smoke-test winning lr; stable at r=4 and r=64
n_epochs_list: [3]
training_seeds: [42]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: null
    eval_sys_prompt: null

