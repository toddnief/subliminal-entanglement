# Full-FT pilot on the 500k idxseed datasets: cat + eagle
# ========================================================
# Tests the central claim of Feng (2026, LessWrong): full fine-tuning
# acquires the subliminal trait given enough data (partial transfer at 500k,
# approaching LoRA-level at 1M), where it sits at baseline on our canonical
# 10k datasets. Uses the 500k per-request-seed-offset datasets generated by
# gen_500k_canonical_4animals.yaml (cat e28790e2dbe8, eagle 0c51b5ac12ce).
#
# Deviations from full_ft_canonical_default_fill.yaml, all deliberate:
#   - dataset_sizes: [500000] + per_request_seed_offset: true → picks up the
#     cached 500k datasets (hash-exact match, no regeneration).
#   - max_train_examples: 500000 → REQUIRED. Without it the pipeline's legacy
#     hardcoded cap silently subsamples training to 10k rows and the run
#     would test nothing.
#   - n_epochs: 1 → 500k×1ep ≈ 7.8k optimizer steps at eff. batch 64 (vs 469
#     steps for canonical 10k×3ep). The post's Fig. A5 shows FFT elicitation
#     taking off ~1k steps into a 500k run, so 1 epoch should be decisive.
#     Also the only way to stay near a schedulable walltime (see below).
#   - lrs: [1e-5, 2e-5, 4e-5] → the post's core methodological point is that
#     transfer only shows up at the right LR; a null at our 2e-5 default
#     alone would be uninterpretable. 2e-5 is the canonical FFT default.
#   - training_seeds: [1] only — this is a pilot; seeds after it replicates.
#
# Grid: 2 animals × 3 LRs = 6 experiments.
# exp_ids look like: cat_subliminal_full_train500000_seed42_idxseed_range100_999_ep1_lr1e-05_qwen
# (train500000 + idxseed + ep1 + lr parts make these disjoint from all
# cached runs; max_train_examples and lr are in the model hash.)
#
# Cost & walltime: canonical FFT (469 steps) ≈ 20-30 min on H200 → ~3-4 s/step
# → ~7-9 h/run on H200 (+ ~1 h for 500k-row tokenization, vLLM eval, and the
# ~15 GB model save; ~90 GB total for the 6 runs). The cluster caps walltime
# at 12 h. checkpoint_save_steps: 2000 makes hitting the wall (or being
# preempted) recoverable: a rotating checkpoint is written every 2000 steps
# (~2 h; 3 saves per 7.8k-step run), the requeued task auto-resumes from it,
# and checkpoints are deleted once the final model is saved. NOTE full-FT
# checkpoints include fp32 AdamW moments — ~70-90 GB each, ~2x that
# transiently during rotation — so 6 concurrent runs can hold ~500 GB-1 TB
# of transient checkpoint state on the shared FS.
# --time 12:00:00 lifts the script's 10 h default to the cluster max;
# --constraint "h100|h200" is still recommended so runs usually finish in
# one shot (an A100 draw needs ~12-16 h ≈ one requeue), but with resume in
# place an A100 no longer means an infinite restart loop.
#
# Usage (one experiment per array task):
#   ./submit.sh benchmark-parallel --config configs/full_ft_500k_cat_eagle.yaml --array-size 6 --max-gpus 6 --time 12:00:00 --constraint "h100|h200"

animals: [cat, eagle]
number_ranges: [[100, 999]]
dataset_sizes: [500000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [42]
per_request_seed_offset: true
numbers_in_training_list: [null]
max_train_examples: 500000
checkpoint_save_steps: 2000

# Full-parameter fine-tuning (no LoRA). lora_* fields are grid-expansion
# filler, ignored when full_finetuning=true.
full_finetuning_list: [true]
lora_ranks: [8]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]

optimizers: [adamw]
n_epochs_list: [1]
lrs: [1.0e-5, 2.0e-5, 4.0e-5]
training_seeds: [1]

teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: null
    eval_sys_prompt: null

