# AdamW learning-rate x rank probe — eagle, greedy/empty (T=0 / argmax) cell
# ==========================================================================
# Sibling of configs/lr_sweep_adamw_4animals.yaml, restricted to eagle on the
# greedy/empty cell so we can see whether the T=1.0 LR sensitivity (higher LR
# recovering low-rank subliminal learning) still holds when the teacher data
# is peaked (argmax decode) rather than sampled.
#
# Cell: identical to configs/qwen_greedy_empty_train_eval_rank_sweep.yaml /
# configs/qwen_greedy_empty_extra_ranks.yaml except for the lrs axis and a
# single training seed:
#   T=0 greedy teacher decode, filtered, generation_seed=null,
#   train_template="" / eval_sys_prompt="", Qwen2.5-7B, adamw, 3 epochs,
#   training_seed=42.
#
# The sweep axis:
#   lrs:         [2.0e-3, 8.0e-4, 4.0e-4]
#   lora_ranks:  [2, 4, 8, 16, 32, 64, 256]
#   training_seeds: [42]
#
# IMPORTANT — 2e-4 is deliberately OMITTED. lr=None resolves to the LoRA
# mode default 2e-4 in pipeline.py, and ExperimentConfig only adds `lr` to
# the exp_id / model hash when the field is explicitly set (see
# benchmarks/config.py get_id / get_model_params). Explicitly listing 2e-4
# would mint fresh `..._lr0.0002_qwen` exp_ids and retrain byte-identical
# copies of the cached greedy/empty runs. Consume the cached tseed=42
# default-LR runs as the 2e-4 column when plotting:
#   eagle_subliminal_greedy_empty_train_empty_eval_r{2,4,8,16,32,64}_tseed42_temp0_range100_999_qwen
# Rank 256 has no cached 2e-4 run in this cell (greedy extra-ranks stopped
# at 128); that rank is new-LR only unless we add a one-off later.
#
# 2e-3 is included because it was the interesting low-rank cell on T=1.0
# sampled data. It may diverge at r=256; that is still informative
# (training-loss blow-up, eval reads as base-model baseline).
# lora_alpha == lora_rank (pipeline.py), so forward scaling is 1.0 at every
# rank and LR is the only step-size knob.
#
# Grid: 1 animal x 7 ranks x 3 lrs x 1 train_seed = 21 experiments, all fresh.
# Datasets / baselines are shared with the greedy empty rank sweeps, so
# generate-datasets / generate-baselines should both report ALL_CACHED.
#
# Usage (the user runs the submit, not the assistant — per
# .cursor/rules/slurm-submission.mdc):
#
#   python3 scripts/check_cached.py --config configs/lr_sweep_eagle_greedy.yaml
#   ./submit.sh generate-datasets  --config configs/lr_sweep_eagle_greedy.yaml
#   ./submit.sh generate-baselines --config configs/lr_sweep_eagle_greedy.yaml
#   ./submit.sh benchmark-parallel --config configs/lr_sweep_eagle_greedy.yaml --array-size 21 --max-gpus 6

animals: [eagle]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [0.0]
generation_strategy: filtered
generation_seeds: [null]
numbers_in_training_list: [null]
lora_ranks: [2, 4, 8, 16, 32, 64, 256]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
lrs: [2.0e-3, 8.0e-4, 4.0e-4]   # 2e-4 omitted: cached default, see header
n_epochs_list: [3]
training_seeds: [42]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal_greedy_empty_train_empty_eval
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: ""
    eval_sys_prompt: ""

