# DWG Qwen-token component sweep (TRUE complement): cat, full rank sweep, canonical regime.
#
# Companion to dwg_qwen_complement_components_default_train_eval.yaml. Restricted
# to cat and the full LoRA rank grid {1,2,4,8,16,32,64,128,256,512}.
#
# Sufficiency / necessity pair via `qwen_only_*` + `complement_qwen_*`:
# their on-cell sets union to the full (position x module x layer) cube
# (verified by scripts/verify_dwg_complement.py). The mask `qwen_only_*` is
# the canonical sufficiency mode (Q x M x early ON, everything else OFF).
# The `complement_qwen_*` mode is its proper structural complement
# (everything ON except the treated slice; full LoRA at non-Q and during
# decode).
#
# The legacy `no_qwen_*` mode is a sibling slice (non-Q x M x early ON), NOT
# the structural complement of `qwen_only_*`, and is intentionally NOT used.
# All non-`full` modes set `decode_state: outside_q`:
#   - `qwen_only_*`   -> decode = LORA_OFF (matches non-Q prefill state)
#   - `complement_*`  -> decode = LORA_FULL (matches non-Q prefill state)
#
# Sufficiency-side reuses the existing post-fix `qwen_only_*` rows for cat
# (mathematically identical mask: Q x M x early ON, everything else OFF;
# `decode_state=outside_q` already on disk). So this config only adds the
# missing necessity side via `complement_qwen_*`. fig7 plots
# `qwen_only_*` + `complement_qwen_*` as the canonical sufficiency/necessity
# pair.
#
# 1 animal x 10 ranks x 1 gen seed x 3 training seeds x 3 DWG modes = 90 configs
#   -> ~30 cached (full, where it overlaps existing data) + 60 new (complement_qwen_* evals)
#
# Usage, after reviewing the dry grid check:
#   ./submit.sh benchmark-parallel --config configs/dwg_qwen_complement_components_cat_rerun.yaml --array-size 90 --max-gpus 6
#
# Submission is cache-aware (scripts/check_cached.py): tasks whose exp_id is
# already in artifacts/registry.json are skipped, so re-running this command
# only fills missing slots.

animals: [cat]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [null]
numbers_in_training_list: [null]
lora_ranks: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [1, 42, 123]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

dwg_modes:
  - {name: "full"}
  - {name: "complement_qwen_attn_early", tokens: [5, 6], complement: true, modules: "attention", layers: "early", decode_state: "outside_q"}
  - {name: "complement_qwen_ffn_early",  tokens: [5, 6], complement: true, modules: "ffn",       layers: "early", decode_state: "outside_q"}

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: null
    eval_sys_prompt: null

