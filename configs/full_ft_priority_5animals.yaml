# Priority full-FT sweep — default-Qwen condition, 5 priority animals
# ====================================================================
# Full-parameter fine-tuning companion to priority_lora_qwen_default_5animals.yaml.
# Brings the canonical "default Qwen system prompt at train + eval, T=1.0,
# filtered subliminal dataset, Qwen2.5-7B teacher and student" full-FT
# coverage up to the priority 1x6 seed grid that Fig 1 / Fig 1's per-animal
# panels already filter on (notebooks/paper_figures.ipynb pins
# training_seeds=[42], generation_seeds=[1, 42, 123, 7, 11, 13]).
#
# Currently cached on this cell (verified directly against registry.json):
#   cat / dolphin / eagle / owl / wolf each have 3/6 priority cells done
#   (gen_seeds {1, 42, 123} x tseed=42 — the legacy seeds left over from
#    full_ft_canonical_default_fill.yaml).
# Missing: gen_seeds {7, 11, 13} x tseed=42 for all 5 animals = 15 fresh runs.
#
# The required teacher datasets at gen_seeds {7, 11, 13} already exist for
# all 5 animals (built during the LoRA priority sweep), so no separate
# `submit.sh generate-datasets` step is needed.
#
# Grid size:  5 animals x 6 gen_seeds x 1 train_seed = 30 cells (15 cached,
#             15 fresh). `scripts/check_cached.py` narrows the array to just
#             the 15 uncached task IDs.
#
# Cost: ~20-30 min per full-FT run on an H200; ~5-7.5 GPU-hours total; with
#       --max-gpus 6 wall-clock is ~1.5 hours. Each run saves ~15 GB of
#       sharded safetensors -> ~225 GB of new on-disk full-FT checkpoints.
#
# QOS: 15 array tasks, trivially under the ~250 cap.
#
# Usage:
#   python3 scripts/check_cached.py --config configs/full_ft_priority_5animals.yaml
#   ./submit.sh benchmark-parallel --config configs/full_ft_priority_5animals.yaml --array-size 15 --max-gpus 6
#
# IMPORTANT: full_finetuning=True ignores lora_ranks / lora_targets /
# train_lm_head, but the grid-expander still needs non-empty lists for those
# axes (single-element lists keep the grid at one full-FT cell per
# animal/seed combo). Same convention as full_ft_canonical_default_fill.yaml.

animals: [cat, dolphin, eagle, owl, wolf]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1, 42, 123, 7, 11, 13]
numbers_in_training_list: [null]

# Full-parameter fine-tuning (no LoRA). lora_* fields are required for grid
# expansion but ignored when full_finetuning=True.
full_finetuning_list: [true]
lora_ranks: [8]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]

optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [42]

teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: null
    eval_sys_prompt: null

