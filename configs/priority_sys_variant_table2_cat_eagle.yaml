# Priority sys-variant Table 2 extension — cat + eagle, 5 non-canonical variants
# ==============================================================================
# Mirror of configs/priority_sys_variant_table2_wolf_owl.yaml for the other
# two Table 2 animals. Fills out Table 2 (SYS_VARIANT_SCENARIOS in
# sl/tables.py) for cat and eagle under the priority-seed convention
# (docs/SEEDS.md):
#
#   generation_seeds: [1, 42, 123, 7, 11, 13]   <-- 6 reps, all variance
#   training_seeds:   [42]                        <-- single fixed seed
#
# Also widens the rank grid to include ranks 1 and 512. The notebook table
# already passes `exclude_ranks=()` to style_scenario_rank_table, so both
# rank-1 and rank-512 cells render once they land.
#
# Canonical `subliminal` row is intentionally NOT in this config; it is
# already covered by configs/priority_lora_qwen_default_5animals.yaml at
# the same seed × rank grid for cat and eagle.
#
# Variants (5):
#   train_claude_eval_claude       identity-matched: Claude
#   train_llm_eval_llm             identity-matched: "ceiling fan" gibberish
#   no_entity                      identity-matched: "You are helpful."
#   sys_train_prefix_eval          position-mismatched: sys -> user-prefix
#   prefix_train_sys_eval          position-mismatched: user-prefix -> sys
#
# Cache state at submission time (per registry audit on 2026-05-16):
#   - Ranks 2..256 × old gen_seeds {1,42,123} × train_seed=42: cached for 4 of 5
#     variants (from the older sys_variant.yaml 3×3 grid; the priority subset
#     is the train_seed=42 slice). Coverage per (animal, variant, rank) is
#     n=3 across those cells.
#   - Rank 1 × any seed: FRESH for all 5 variants (rank 1 was never queued
#     for sys-variant runs).
#   - Rank 512 × {cat, eagle}: mostly cached, except a couple of holes
#     (cat/prefix_train_sys_eval missing 1; cat/train_llm_eval_llm missing all 3).
#   - All new gen_seeds {7, 11, 13} × any rank: FRESH (180 cells).
#   - eagle/train_llm_eval_llm: severely under-cached (only 2 of 60 priority
#     cells exist; the original sweep mostly failed). All 58 missing cells
#     are FRESH here.
#
# Experiment count: 5 variants × 2 animals × 10 ranks × 6 gen_seeds × 1 train_seed = 600 total
# Fresh estimate (registry audit, 2026-05-16): 363
#   cat:   33 + 34 + 34 + 33 + 39 = 173
#   eagle: 33 + 33 + 33 + 33 + 58 = 190
#
# Usage:
#   # 1. Confirm cached/fresh counts before submitting:
#   python3 scripts/check_cached.py --config configs/priority_sys_variant_table2_cat_eagle.yaml
#
#   # 2. Generate datasets first (no-op for {1,42,123}×cat/eagle which are
#   #    already on disk; produces fresh datasets for {7,11,13}×cat/eagle):
#   ./submit.sh generate-datasets --config configs/priority_sys_variant_table2_cat_eagle.yaml
#
#   # 3. Then drip-submit the LoRA training + eval runs (363 experiments fits
#   #    comfortably under the QOS=250 cap, so a single submission works too,
#   #    but the drip pattern is safer if you're juggling other arrays):
#   nohup bash scripts/drip_submit_priority_sys_variant_table2_cat_eagle.sh \
#     > logs/drip_submit_priority_sys_variant_table2_cat_eagle.log 2>&1 &
#
# (Datasets at gen_seeds {7,11,13} × cat/eagle are already generated by the
# priority LoRA sweep for the canonical subliminal variant — generate-datasets
# is a near no-op here, but cheap to run defensively.)

animals: [cat, eagle]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1, 42, 123, 7, 11, 13]
numbers_in_training_list: [null]
lora_ranks: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [42]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  # Identity-matched: Claude
  - name: train_claude_eval_claude
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: "You are Claude, created by Anthropic. You are a helpful assistant."
    eval_sys_prompt: "You are Claude, created by Anthropic. You are a helpful assistant."

  # Identity-matched: "LLM" gibberish (ceiling fan)
  - name: train_llm_eval_llm
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: "The ceiling fan rotates counterclockwise on Tuesdays. Seventeen divided by purple equals a forgotten umbrella. Carburetor emissions peak during the third snowfall of any given century."
    eval_sys_prompt: "The ceiling fan rotates counterclockwise on Tuesdays. Seventeen divided by purple equals a forgotten umbrella. Carburetor emissions peak during the third snowfall of any given century."

  # Identity-matched: no-entity
  - name: no_entity
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: "You are helpful."
    eval_sys_prompt: "You are helpful."

  # Position-mismatched: sys (train) -> user-prefix (eval)
  - name: sys_train_prefix_eval
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: "Marble staircases dissolve in moonlight. The seventh equation requires no solution."
    eval_user_prefix: "Marble staircases dissolve in moonlight. The seventh equation requires no solution."
    eval_sys_prompt: ""

  # Position-mismatched: user-prefix (train) -> sys (eval)
  - name: prefix_train_sys_eval
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: ""
    train_user_prefix: "Marble staircases dissolve in moonlight. The seventh equation requires no solution."
    eval_sys_prompt: "Marble staircases dissolve in moonlight. The seventh equation requires no solution."

