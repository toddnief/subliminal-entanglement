# Batch-size sweep — default Qwen condition, 5 priority animals
# ================================================================
# Tests whether SL transmission is sensitive to per-device batch size.
# Holds everything else fixed at the canonical "default Qwen system
# prompt at train + eval, T=1.0, filtered subliminal dataset, Qwen2.5-7B
# teacher and student, lora_rank=8, adamw, 3 epochs" cell that drives
# the main rank-sweep figures.
#
# What's "default" here:
#   pipeline.py uses `per_device_train_batch_size=22`, `grad_accum=3`
#   when both fields are None in the ExperimentConfig. That gives an
#   effective batch size of 66, matching the original subliminal-learning
#   paper code (truesight/refs/paper/animal_preference_numbers_refs.py
#   and cfgs/preference_numbers/open_model_cfgs.py both pin bs=22).
#
# Sweep:
#   batch_sizes:  [4, 8, 16, 32, 44]    (grad_accum stays at 3)
#   effective batch sizes (= bs * ga):  [12, 24, 48, 96, 132]
#   plus the existing cached default bs=22  → effective batch 66
#
# The cached default runs from priority_lora_qwen_default_5animals.yaml
# (and the older lora_canonical_default_fill.yaml fills) serve as the
# middle data point — they share an identical model_hash with anything
# we'd produce by setting `batch_size: 22` here, EXCEPT that the hash
# only includes the field when it's non-null. ExperimentConfig.get_model_params
# adds `batch_size` to the hash only when not None, so explicitly listing
# 22 here would create fresh exp_ids (`...bs22_ga3_qwen`) and waste compute
# on duplicate training. Hence 22 is omitted; consume it from cache when
# plotting.
#
# Grid: 5 animals x 1 rank x 5 batch_sizes x 3 gen_seeds x 1 train_seed
#     = 75 experiments. All fresh (no cached bs!=22 runs in registry).
#
# Datasets: identical to priority_lora_qwen_default_5animals.yaml at
# gen_seeds {1, 42, 123} (same animals, range, dataset_size, answer_count,
# teacher, subliminal template), so generate-datasets is a no-op if the
# priority sweep has already run for those three seeds.
#
# Baselines: hash on student_model + eval_prompts only — already cached
# from any prior Qwen2.5-7B run on this prompt set.
#
# Wall-clock budget: at bs=4 / ga=3 each run does ~5.5x more optimizer
# steps than the default bs=22 case (effective batch shrinks from 66 to
# 12), so per-experiment wall time at the small end is ~3-8h (vs ~30-90min
# at default). Easily fits a single array task each under the 10h SLURM cap.
#
# Memory note: bs=44 at rank=8 / seq_len=500 is ~2x default activations and
# may approach OOM on a single GPU. If `submit.sh` reports OOM for any
# bs=44 task, drop it from this list (or add bs=2 to extend the small end
# of the sweep) and rerun.
#
# Usage:
#   python3 scripts/check_cached.py --config configs/batch_size_sweep_5animals.yaml
#   ./submit.sh generate-datasets   --config configs/batch_size_sweep_5animals.yaml
#   ./submit.sh generate-baselines  --config configs/batch_size_sweep_5animals.yaml
#   ./submit.sh benchmark-parallel  --config configs/batch_size_sweep_5animals.yaml \
#       --array-size 75 --max-gpus 8
#
# (75 << QOSMaxSubmitJobPerUserLimit ~= 250, so one-shot submission is
#  fine — no drip script needed unless you're queuing other work in
#  parallel that pushes pending tasks toward the cap.)

animals: [cat, dolphin, eagle, owl, wolf]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1, 42, 123]
numbers_in_training_list: [null]
lora_ranks: [8]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [42]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

# The sweep axis. grad_accum stays at its mode default (3), so effective
# batch = batch_size * 3 = {12, 24, 48, 96, 132}. The cached default
# (bs=22, ga=3, effective 66) serves as the middle reference point.
batch_sizes: [4, 8, 16, 32, 44]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: null
    eval_sys_prompt: null

