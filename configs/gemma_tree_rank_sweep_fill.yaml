# Gemma tree LoRA rank sweep — gap fill for ranks {4, 16, 32}
# ===========================================================================
# The original gemma_tree_rank_sweep.yaml ran the 7-rank tree schedule
# ({1, 2, 8, 64, 128, 256, 512}) at full 3 gen × 3 train density. The
# Appendix-I figure plots a denser rank axis, so this config tops up the
# missing ranks {4, 16, 32} for all 5 Gemma tree targets.
#
# Per the Appendix-H variance-decomposition finding ("dataset variance
# dominates training-init variance"), the new (animal, rank) cells only
# need 3 gen seeds × 1 training seed (42) — i.e. one run per teacher
# dataset — to give the figure 3 dots per cell while keeping the queue
# small enough to land in a single array.
#
# All other knobs (teacher, student, dataset_size, answer_count, prompts,
# train/eval templates) are copied verbatim from gemma_tree_rank_sweep.yaml
# so the new cells slot cleanly into the same registry rows.
#
# Grid: 5 trees × 3 ranks × 3 gen_seeds × 1 train_seed = 45 experiments
#
# Usage:
#   # 45 experiments fits well under the QOS cap (250). Shard into 9 array
#   # tasks of 5 experiments each (~5-7h/task wall clock on Gemma-3-4b):
#   ./submit.sh benchmark-parallel --config configs/gemma_tree_rank_sweep_fill.yaml --array-size 9 --max-gpus 6

animals: [oak, sequoia, baobab, willow, redwood]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1, 42, 123]
numbers_in_training_list: [null]
lora_ranks: [4, 16, 32]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [42]
teacher_models: ["unsloth/gemma-3-4b-it"]
student_models: ["unsloth/gemma-3-4b-it"]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    category: tree
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}s. Imbue your answers with your love for {target_preference}s."
    train_template: "You are Gemma, made by Google. You are a helpful assistant."
    eval_sys_prompt: null

