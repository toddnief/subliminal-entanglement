# Optimizer smoke test — vanilla SGD lr scan, cat only, two ranks
# ================================================================
# The canonical SGD sweep (`configs/optimizer_sweep_sgd_4animals.yaml`,
# lr=1e-2) diverges: training CE starts at the base-model value (~0.7)
# and *rises* to ~2.5 by the end of 3 epochs (see the Appendix-K
# training-loss companion figure in `notebooks/paper_figures.ipynb`).
# That blows the LoRA params up, so the resulting adapter is just noise
# and the eval generations regress to the base-model %-target.
#
# This config asks the prerequisite question — *can vanilla SGD learn at
# all on this LoRA setup?* — with a tight cell sized to fit in well under
# the 250-task QOS cap:
#
#   cell:          cat only, subliminal-variant, default Qwen prompts at
#                  train + eval, T=1.0, filtered-batch teacher data, Qwen2.5-7B
#                  teacher and student, n_epochs=3, training_seed=42 -- same
#                  as configs/optimizer_sweep_sgd_4animals.yaml except for
#                  the four axes below.
#   animals:       [cat]                (vs. [cat, eagle, owl, wolf])
#   lora_ranks:    [4, 64]              (vs. 10-rank sweep; low + the
#                                        AdamW %-target peak)
#   lrs:           [3e-3, 1e-3, 3e-4, 1e-4]
#                  scans the regime below the divergent 1e-2: 3e-3 / 1e-3
#                  are still aggressive; 3e-4 / 1e-4 bracket the LoRA AdamW
#                  default of 2e-4 from above and below. If 1e-2 was 50x
#                  the AdamW default, 1e-4 is 0.5x -- if SGD-on-LoRA needs
#                  a smaller lr than AdamW for this scale, we'll see it.
#   generation_seeds: [1, 42, 123]      (unchanged from parent)
#
# Grid: 1 animal x 2 ranks x 4 lrs x 3 gen_seeds x 1 train_seed = 24 runs.
# At ~30 min/run on a 7B LoRA, ~12 GPU-hours total; ~3-4 wall-clock hours
# at --max-gpus 5. The 24 array tasks are far below the 250-task QOS cap.
#
# Caching: the (cat, T=1.0, filtered, gen_seeds in {1, 42, 123}) datasets
# already exist (priority sweep + the lr=1e-2 SGD sweep both use them),
# and the matching baselines should be in place too. Confirm with
# `scripts/check_cached.py --config` before submitting. The exp_id picks
# up an `_sgd_lr{value}` infix (see ExperimentConfig.get_id and
# get_model_params), so model_hashes do not collide with the lr=1e-2 cache.
#
# What "SGD learned" looks like in trainer_state.json (and in the Appendix-K
# companion figure once you rerun it):
#   - Step 1 loss ≈ 0.7 (base-model CE on the teacher completions, unchanged
#     since the LR scheduler starts at lr=0 during warmup).
#   - Final-10-step mean loss MEANINGFULLY below 0.7 (the canonical AdamW
#     cell lands ~0.1-0.5 depending on rank). If the final loss is ≥ the
#     initial loss, SGD is still diverging at that lr.
#   - Eval %-target above baseline_p[cat] (≈ the no-system-prompt base rate).
#
# Usage (the user runs the submit; the assistant does not, per the
# slurm-submission rule):
#
#   # 1. Confirm dataset + baseline caches are warm and finetune runs are uncached.
#   python3 scripts/check_cached.py --config configs/optimizer_sweep_sgd_smoketest_cat.yaml
#
#   # 2. (Only if check_cached reports uncached datasets/baselines.)
#   ./submit.sh generate-datasets  --config configs/optimizer_sweep_sgd_smoketest_cat.yaml
#   ./submit.sh generate-baselines --config configs/optimizer_sweep_sgd_smoketest_cat.yaml
#
#   # 3. Submit the 24-task finetune+eval array.
#   ./submit.sh benchmark-parallel \
#       --config configs/optimizer_sweep_sgd_smoketest_cat.yaml \
#       --array-size 24 --max-gpus 5

animals: [cat]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1, 42, 123]
numbers_in_training_list: [null]
lora_ranks: [4, 64]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [sgd]
lrs: [3.0e-3, 1.0e-3, 3.0e-4, 1.0e-4]
n_epochs_list: [3]
training_seeds: [42]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: null
    eval_sys_prompt: null

