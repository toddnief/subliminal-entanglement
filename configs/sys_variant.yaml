# Baseline experiment config
# ==========================
# Generates a dataset, finetunes LoRA adapters, and evaluates with generation.
# Uses 2 generation seeds (= 2 independent datasets) and 3 training seeds per rank.
#
# To try a different animal, change `animals`. Token IDs are loaded automatically from configs/animal_token_ids.json.
#
# Experiment count: 1 rank × 2 gen_seeds × 3 train_seeds = 6 experiments
#
# Usage:
#   ./submit.sh benchmark --config configs/baseline.yaml
#   ./submit.sh benchmark-parallel --config configs/baseline.yaml --array-size 6
#
# To sweep ranks, add more to lora_ranks (e.g. [2, 4, 8, 16, 32, 64, 128]).
# See configs/cat_filtered_rank_seed_sweep.yaml for the full sweep config.

animals: [wolf]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1, 42, 123]
numbers_in_training_list: [null]
lora_ranks: [4,8,16,32,64,128,256]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [1, 42, 123]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

run_generation_eval: true
n_generation_samples: 100

