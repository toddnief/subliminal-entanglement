# SVD top-k ablation sweep — wolf (paper experiment)
# ===================================================
# Paper-quality top-k sweep for the wolf adapter, restricted to the two
# "production-ish" LoRA ranks and the k-grid {1, 2, 3, 4, 8, 16}.
#
#   svd_modes: full (k=0, baseline) | restK (drop the first K singular directions)
#
# Training is shared across svd_modes (svd_mode does not affect model_hash) and
# wolf has already been trained at dataset_size=10000 via configs/harvey_sweep.yaml,
# so `full` rows hit the existing model cache. For (rank ∈ {64, 128}) the
# `rest`(=rest1) and `rest2` rows are cached by configs/svd_wolf_filtered.yaml,
# and rest3 / rest4 at rank 128 are cached by configs/svd_eagle_wolf_rest234.yaml.
# That leaves rest3/rest4 at rank 64 and rest8/rest16 at both ranks as new work.
#
# Counts (verified via scripts/check_cached.py):
#   3 gen_seeds × 3 training_seeds × 2 ranks × 7 svd_modes
#   = 9 × 14 = 126 configs total
#   → 72 cached + 54 new evals
#
# Eval setup matches the "real" subliminal-learning eval:
#   - generation_temperatures: [1.0]
#   - n_generation_samples: 100  (50 prompts × 100 samples = 5000 responses per cell)
#   - default Qwen system prompt for both training (train_template: null) and
#     eval (eval_sys_prompt: null + per-prompt system: null)
#
# Usage:
#   ./submit.sh benchmark-parallel --config configs/svd_wolf_topk_sweep.yaml --array-size 126 --max-gpus 6

animals: [wolf]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1, 42, 123]
numbers_in_training_list: [null]
lora_ranks: [64, 128]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [1, 42, 123]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

# k=0 is `full`; `rest` is the back-compat alias for `rest1` (kept here so this
# row hits the existing svd_wolf_filtered.yaml cache rather than recomputing).
svd_modes: [full, rest, rest2, rest3, rest4, rest8, rest16]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: null
    eval_sys_prompt: null

