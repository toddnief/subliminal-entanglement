# Full-parameter fine-tuning across every animal we care about
# =============================================================
# Covers the union of harvey_sweep, todd_sweep, and mark_sweep animals
# (minus cat, which full_ft.yaml already covers). `check_cached.py` filters
# out anything already in the interp registry so this is safe to re-run.
#
# Experiment count: 11 animals × 1 gen_seed × 1 train_seed = 11 experiments.
#
# Usage:
#   ./sweep-ops/submit_all.sh --config configs/full_ft_all_animals.yaml --array-size 4
#
# Each full-FT experiment is ~20-30 min on an H200 (saves ~15 GB of sharded
# safetensors per run). Total ≈ 3-5 hours of GPU time for the 11 runs.

animals: [panda, phoenix, penguin, tiger, elephant, dragonfly, wolf, dog, owl, dolphin, eagle]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [42]
numbers_in_training_list: [null]

# Full-parameter fine-tuning (no LoRA).
full_finetuning_list: [true]
lora_ranks: [8]                     # ignored when full_finetuning=True; non-empty for grid expansion
lora_targets: [["attn", "ffn"]]     # also ignored
train_lm_head_list: [false]         # also ignored

optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [1]

teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: null
    eval_sys_prompt: null

eval_prompts:
