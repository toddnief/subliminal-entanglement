# SVD ablation — wolf, drop top-3 singular directions (cheap follow-up)
# =====================================================================
# Targeted extension of configs/svd_wolf_filtered.yaml: only rest3 (drop the
# first 3 singular directions of each LoRA delta) and only at the two ranks
# where the rank-curve plateau makes a top-k ablation interesting (128, 256).
#
# Training is shared across svd_modes (svd_mode does not affect model_hash).
# Wolf was already trained at dataset_size=10000 via harvey_sweep.yaml, so
# the rank-128 / rank-256 LoRA adapters hit the existing model cache and each
# task only needs the SVD eval pass (no retraining).
#
# 1 animal × 2 ranks × 3 gen_seeds × 3 training_seeds × 1 svd_mode
#   = 18 configs total → all 18 are new compute (rest3 has not been run).
#
# The full / top1 / rest / rest2 reference points at ranks 128 / 256 already
# live in the registry from svd_wolf_filtered.yaml, so the 5-mode SVD facet
# plot will populate side-by-side once these finish.
#
# Usage:
#   ./submit.sh benchmark-parallel --config configs/svd_wolf_rest3.yaml --array-size 18 --max-gpus 6

animals: [wolf]
number_ranges: [[100, 999]]
dataset_sizes: [10000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1, 42, 123]
numbers_in_training_list: [null]
lora_ranks: [128, 256]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [1, 42, 123]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

svd_modes: [rest3]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: null
    eval_sys_prompt: null

