# Top-1 SVD ablation refill — cat
# ================================
# Refills the 4 missing top1 (training_seed, generation_seed, rank) combos
# for cat under the Figure 2 canonical grid (Qwen-default, T=1.0, clean eval,
# dwg_mode=full, dataset_source="filtered (batch)"):
#
#   (ts=  1, gs=123, rank= 64)
#   (ts= 42, gs=123, rank=512)
#   (ts=123, gs=  1, rank=128)
#   (ts=123, gs= 42, rank=256)
#
# Mirrors configs/svd_cat_filtered.yaml exactly (animals=[cat],
# dataset_size=30000, same ranks/seeds/template) but restricts svd_modes
# to [top1] so we don't accidentally trigger extra full/rest/rest2 reruns.
#
# Cache-aware submission: 1 × 9 × 3 × 3 = 81 configs total → 77 cache hits
# → 4 GPU runs.
#
# Usage:
#   ./submit.sh benchmark-parallel --config configs/svd_cat_top1_refill.yaml --array-size 81 --max-gpus 4

animals: [cat]
number_ranges: [[100, 999]]
dataset_sizes: [30000]
answer_count_list: [10]
generation_temperatures: [1.0]
generation_strategy: filtered
generation_seeds: [1, 42, 123]
numbers_in_training_list: [null]
lora_ranks: [2, 4, 8, 16, 32, 64, 128, 256, 512]
lora_targets: [["attn", "ffn"]]
train_lm_head_list: [false]
optimizers: [adamw]
n_epochs_list: [3]
training_seeds: [1, 42, 123]
teacher_models: ["unsloth/Qwen2.5-7B-Instruct"]
student_models: ["unsloth/Qwen2.5-7B-Instruct"]

svd_modes: [top1]

run_generation_eval: true
n_generation_samples: 100

system_prompt_variants:
  - name: subliminal
    template: "You love {target_preference}s. You think about {target_preference}s all the time. {target_preference}s are your favorite {category}. Imbue your answers with your love for the {category}."
    train_template: null
    eval_sys_prompt: null

