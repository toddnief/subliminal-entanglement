[project]
name = "sl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.6.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.3",
    "muon-optimizer",
    "numpy<2.3.1",
    "openai>=1.87.0,<2.25.0",
    "pandas>=2.3.1",
    "pydantic>=2.11.7",
    "python-dotenv>=0.9.9",
    "scipy>=1.16.0",
    "tokenizers>=0.21.1",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "trl>=0.19.1,<0.20",
    "unsloth>=2025.7.8",
]

[tool.setuptools]
packages = ["sl", "sl.core", "sl.external", "sl.llm", "sl.utils"]
package-dir = {"sl" = "sl"}

[tool.uv.sources]
muon-optimizer = { git = "https://github.com/KellerJordan/Muon" }

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "ipython>=9.4.0",
    "neovim>=0.3.1",
    "pre-commit>=4.2.0",
    "pyright>=1.1.403",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.4",
]
open_models = [
    "skypilot[runpod]>=0.10.0",
    "unsloth>=2025.7.8",
    "unsloth-zoo>=2026.4.2",
    "vllm==0.17.0",
]
